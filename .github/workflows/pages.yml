name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and build showcase app
        working-directory: web
        env:
          # Project Pages URL: https://agent5479.github.io/sollys/
          VITE_BASE: /sollys/
          VITE_SHOWCASE_MODE: "true"
        run: |
          npm ci
          npm run build
      - name: Verify project-pages assets
        working-directory: web
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/.nojekyll
          test ! -f dist/CNAME
          grep -q 'href="/sollys/assets/' dist/index.html
          grep -q 'src="/sollys/assets/' dist/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
