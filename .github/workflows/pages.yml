name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and build showcase app
        working-directory: web
        env:
          # Root base so styles load on custom domain (and on github.io after domain redirect).
          VITE_BASE: /
          VITE_SHOWCASE_MODE: "true"
        run: |
          npm ci
          npm run build
      - name: Verify custom-domain root assets
        working-directory: web
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/.nojekyll
          test -f dist/CNAME
          grep -q 'www.sollys.co.nz' dist/CNAME
          grep -q 'href="/assets/' dist/index.html
          grep -q 'src="/assets/' dist/index.html
          ! grep -q '/sollys/assets/' dist/index.html
          ! grep -q 'github.io' dist/robots.txt
          ! grep -q 'github.io' dist/sitemap.xml
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Keep custom domain on Pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo '{"cname":"www.sollys.co.nz"}' | gh api --method PUT repos/${{ github.repository }}/pages --input -
